<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe Championship</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Tic-Tac-Toe Championship</h1>
      <p class="subtitle">Best of five &middot; first to <span id="wins-needed">3</span> round wins is champion</p>
      <p class="room">Room: <strong id="room-name">lobby</strong> <span id="connection" class="pill">connecting&hellip;</span></p>
    </header>

    <form id="join-form" class="card" hidden>
      <label for="name-input">Your name</label>
      <div class="row">
        <input id="name-input" maxlength="20" autocomplete="nickname" placeholder="e.g. Ada" required>
        <button type="submit">Join match</button>
      </div>
    </form>

    <section class="scoreboard" aria-label="Match score">
      <div class="player" id="player-X">
        <span class="mark x">X</span>
        <span class="name" id="name-X">Waiting&hellip;</span>
        <span class="score" id="score-X">0</span>
      </div>
      <div class="meta">
        <div>Round <strong id="round">1</strong></div>
        <div class="draws">Draws <span id="draws">0</span></div>
      </div>
      <div class="player" id="player-O">
        <span class="mark o">O</span>
        <span class="name" id="name-O">Waiting&hellip;</span>
        <span class="score" id="score-O">0</span>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="board" class="board" role="grid" aria-label="Tic-tac-toe board"></div>

    <div class="actions">
      <button id="next-round" hidden>Next round</button>
      <button id="new-match" hidden>New match</button>
    </div>

    <p id="error" class="error" role="alert"></p>

    <section class="card" aria-label="Round results">
      <h2>Round results</h2>
      <ol id="history" class="history"></ol>
    </section>
  </main>
  <script src="client.js"></script>
</body>
</html>
